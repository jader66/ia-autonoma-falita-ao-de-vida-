name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar versao do build
        shell: pwsh
        run: |
          $run = [int]$env:GITHUB_RUN_NUMBER
          $version = "1.7.0"
          @"
          APP_VERSION = "$version"
          APP_BUILD = $run
          "@ | Set-Content -Encoding UTF8 version.py
          (Get-Content installer.iss) -replace '#define MyAppVersion "1.7.0"', "#define MyAppVersion `"$version.$run`"" | Set-Content -Encoding UTF8 installer.iss
          Write-Host "Versao: $version | Build: $run"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Baixar modelo de voz
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" -OutFile "models\vosk-model-small-pt-0.3.zip"
          Expand-Archive -Path "models\vosk-model-small-pt-0.3.zip" -DestinationPath "models" -Force
          Remove-Item "models\vosk-model-small-pt-0.3.zip"

      - name: Gerar executavel unico
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Assistente --collect-all vosk --collect-all sounddevice --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 --add-data "models\vosk-model-small-pt-0.3;models\vosk-model-small-pt-0.3" app.py

      - name: Verificar executavel
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Assistente.exe")) { throw "Assistente.exe nao foi gerado." }
          $size = (Get-Item "dist\Assistente.exe").Length
          Write-Host "Assistente.exe gerado: $size bytes"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Criar instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "installer\Assistente-Setup.exe")) { throw "Assistente-Setup.exe nao foi gerado." }

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-Windows-Setup
          path: installer/Assistente-Setup.exe

      - name: Publicar release para atualizacao automatica
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.7.0-build.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "installer/Assistente-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --title "Assistente $tag" --notes "Atualização automática do Assistente." --latest